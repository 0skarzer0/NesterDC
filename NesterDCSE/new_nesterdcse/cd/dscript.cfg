<dreamscript>
	<system name="dreamcast">
		<input>
			<mode name="menu">
				<controller>
					<action name="UP" mapping="UP"/>
					<action name="DOWN" mapping="DOWN"/>
					<action name="CHOOSE" mapping="A"/>
					<action name="BACK" mapping="B"/>
					<action name="START" mapping="START"/>
				</controller>
			</mode>
		</input>
	</system>
</dreamscript>
